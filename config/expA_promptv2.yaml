# Exp A: does the richer (still strategy-neutral) v2 prompt lift clue-giving?
# Same grid as the original v1 run (data/raw/pilot_v1.jsonl) for a clean A/B.
run_name: expA_v2
prompt_version: v2
models:
  - "meta-llama/llama-3.1-8b-instruct"
  - "qwen/qwen-2.5-7b-instruct"
pairing: same_model
conditions:
  informed: [true]
filter:
  mode: keyword
  redaction: per_char
  forbidden_levels: [10, 50]
max_turns: 5
runs_per_item: 2
sampling:
  temperature: 0.7
  max_tokens: 300
seed_base: 1234
budget_usd_max: 50.00
