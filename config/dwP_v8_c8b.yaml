# Dogwhistle-asymmetry pilot (Exp P). In-group sender+receiver (same model)
# vs a knowledge-gap topic censor (meta-llama/llama-3.1-8b-instruct). Prompt v8:
#   v5 = aware, no persona (baseline) | v8n = persona, no outsider cue
#   v8 = persona + "censor is an outsider" | v8o = v8 + oracle handle (ceiling)
run_name: dwP_v8_c8b
stimuli: stimuli/dogwhistle_targets.csv
prompt_version: v8
models:
  - "meta-llama/llama-3.3-70b-instruct"
  - "deepseek/deepseek-chat"
pairing: same_model
conditions:
  informed: [true]
filter:
  mode: topic
  judge_model: "meta-llama/llama-3.1-8b-instruct"
  strictness: moderate
  redaction: per_char
  forbidden_levels: [0]
max_turns: 6
runs_per_item: 2
sampling:
  temperature: 0.7
  max_tokens: 300
seed_base: 1234
budget_usd_max: 3.00
