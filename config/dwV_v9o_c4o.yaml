# Exp V: v9 ablation (v9o) on the Exp R items, gpt-4o-mini decode-censor.
# censor ladder 3B / 8B / gpt-4o-mini; suffix T = conversation-level decode censor.
run_name: dwV_v9o_c4o
stimuli: stimuli/dogwhistle_targets_R.csv
prompt_version: v9o
models:
  - "meta-llama/llama-3.3-70b-instruct"
  - "deepseek/deepseek-chat"
pairing: same_model
conditions:
  informed: [true]
filter:
  mode: topic_decode
  judge_model: "openai/gpt-4o-mini"
  strictness: moderate
  redaction: per_char
  forbidden_levels: [0]
max_turns: 6
runs_per_item: 3
sampling:
  temperature: 0.7
  max_tokens: 300
seed_base: 1234
budget_usd_max: 2.00
