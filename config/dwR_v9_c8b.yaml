# Exp R (round 2): 14 items (12 knowledge-gap + manna/towel no-gap controls),
# censor ladder 3B / 8B / gpt-4o-mini; suffix T = conversation-level decode censor.
run_name: dwR_v9_c8b
stimuli: stimuli/dogwhistle_targets_R.csv
prompt_version: v9
models:
  - "meta-llama/llama-3.3-70b-instruct"
  - "deepseek/deepseek-chat"
pairing: same_model
conditions:
  informed: [true]
filter:
  mode: topic_decode
  judge_model: "meta-llama/llama-3.1-8b-instruct"
  strictness: moderate
  redaction: per_char
  forbidden_levels: [0]
max_turns: 6
runs_per_item: 3
sampling:
  temperature: 0.7
  max_tokens: 300
seed_base: 1234
budget_usd_max: 2.00
