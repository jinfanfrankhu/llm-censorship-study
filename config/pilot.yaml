run_name: pilot_v1

# --------------------------------------------------------------------------- #
# Models. OpenRouter slugs: https://openrouter.ai/models
#
# NOTE ON MECH-INTERP: OpenRouter returns text only -- no activations. Any
# interpretability follow-up (which activations drive creative bypasses) must
# run the OPEN-WEIGHT models below locally (TransformerLens / nnsight) or via
# NDIF. So the open models here are chosen to be instrumentable later; the
# closed model is a behavioral ceiling reference only and cannot be interped.
#
# Cost for the whole pilot on the small open model is ~pennies. Trim this list
# to just the small open model anytime to minimize spend.
# --------------------------------------------------------------------------- #
models:
  # Dense small open models: clean for later mech-interp (TransformerLens/nnsight)
  # and pennies to run. Both confirmed present in the OpenRouter catalog.
  - "meta-llama/llama-3.1-8b-instruct"     # dense 8B -- interp workhorse (free Colab / 1 GPU)
  - "qwen/qwen-2.5-7b-instruct"            # dense 7B -- different family, strong tooling
  # Add a 70B open (qwen/qwen-2.5-72b-instruct) for scaling once the small run lands.
  # Closed frontier models dropped: 10-25x cost and cannot be interpreted.

pairing: same_model        # sender and receiver are the same model (pilot)

conditions:
  informed: [true]         # add false for the optional uninformed arm

filter:
  mode: keyword            # pilot uses keyword only; semantic filter comes later
  redaction: per_char      # per_char ("####" matches length) or fixed ("[REDACTED]")
  # Censorship INTENSITY sweep: block the top-N most-obvious clue words.
  # Stimuli currently ship with 20 ranked forbidden words per target, so
  # level 50 will fall back to all 20 (the runner warns). Extend targets.csv
  # to >=50 ranked words (model-drafted, Frank-approved) before the real
  # 50-word run. Until then, [10, 20] runs cleanly.
  # Small-start sweep: low vs high censorship to see where the effect lands.
  # Add 20 (-> [10, 20, 50]) when expanding to the full grid.
  forbidden_levels: [10, 50]

max_turns: 5               # sender clue turns per trial
runs_per_item: 2           # small start; raise to 3 for the full grid

sampling:
  temperature: 0.7
  max_tokens: 300

seed_base: 1234
budget_usd_max: 10.00      # hard stop
