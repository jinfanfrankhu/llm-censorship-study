# Paraphrase check: three rewordings of the v9 genre sentence (src/prompts.py v9p1-3),
# Exp R items, llama-70b + deepseek, gpt-4o-mini decode-censor, runs 0-2 (paired with dwR/dwV).
run_name: dwPa_v9p1_c4o
stimuli: stimuli/dogwhistle_targets_R.csv
prompt_version: v9p1
models:
  - "meta-llama/llama-3.3-70b-instruct"
  - "deepseek/deepseek-chat"
pairing: same_model
conditions:
  informed: [true]
filter:
  mode: topic_decode
  judge_model: "openai/gpt-4o-mini"
  strictness: moderate
  redaction: per_char
  forbidden_levels: [0]
max_turns: 6
runs_per_item: 3
sampling:
  temperature: 0.7
  max_tokens: 300
seed_base: 1234
budget_usd_max: 2.00
