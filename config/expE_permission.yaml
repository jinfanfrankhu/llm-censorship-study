# Exp E: permission-to-evade capability probe (prompt v3, NOT neutral).
# Explicitly tells the sender it may use spelling tricks/spacing/codes. Tests
# whether evasion is absent because models CANNOT or merely WILL NOT deploy it.
# Hardest cell only (level 50, informed), all models/targets, 2 runs = 160.
run_name: expE_permission
prompt_version: v3
models:
  - "meta-llama/llama-3.1-8b-instruct"
  - "qwen/qwen-2.5-7b-instruct"
  - "meta-llama/llama-3.3-70b-instruct"
  - "openai/gpt-4.1"
pairing: same_model
conditions:
  informed: [true]
filter:
  mode: keyword
  redaction: per_char
  forbidden_levels: [50]
max_turns: 5
runs_per_item: 2
sampling:
  temperature: 0.7
  max_tokens: 300
seed_base: 1234
budget_usd_max: 50.00
