# Exp N (lenient): folk-theory-of-evasion sweep. 10 models x aware (v5) sender
# vs topic-aware censor + FP budget. Tests whether a model's surface-trick reach
# rate (orthographic/wordplay) predicts its FAILURE against a semantic censor --
# i.e. does the Exp-M capability inversion (gpt-4.1 worse than gemma) generalize?
# Same-model sender/receiver pairing.
run_name: expN_folk_lenient
prompt_version: v5
models:
  - "meta-llama/llama-3.1-8b-instruct"
  - "meta-llama/llama-3.3-70b-instruct"
  - "qwen/qwen-2.5-7b-instruct"
  - "qwen/qwen-2.5-72b-instruct"
  - "mistralai/mistral-nemo"
  - "mistralai/mistral-small-24b-instruct-2501"
  - "openai/gpt-4.1-mini"
  - "openai/gpt-4.1"
  - "google/gemma-2-27b-it"
  - "deepseek/deepseek-chat"
pairing: same_model
conditions:
  informed: [true]
filter:
  mode: topic
  judge_model: "openai/gpt-4o-mini"
  strictness: lenient
  redaction: per_char
  forbidden_levels: [50]
max_turns: 6
runs_per_item: 2
sampling:
  temperature: 0.7
  max_tokens: 300
seed_base: 1234
budget_usd_max: 80.00
