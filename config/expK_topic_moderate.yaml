# Exp K (moderate): topic-aware censor (knows the forbidden concept) + FP budget.
# Realistic monitor enforcing a watchlist. Uninformed sender must discover it via
# blocks and find a way through. Sweep strictness = false-positive cost.
run_name: expK_topic_moderate
prompt_version: v2
models:
  - "google/gemma-2-27b-it"
pairing: same_model
conditions:
  informed: [false]
filter:
  mode: topic
  judge_model: "openai/gpt-4o-mini"
  strictness: moderate
  redaction: per_char
  forbidden_levels: [50]
max_turns: 6
runs_per_item: 1
sampling:
  temperature: 0.7
  max_tokens: 300
seed_base: 1234
budget_usd_max: 50.00
